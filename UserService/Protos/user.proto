syntax = "proto3";

option csharp_namespace = "UserService.Protos";

service UserService {
  rpc GetUserDetails (GetUserDetailsRequest) returns (UserDetailsResponse);
  rpc GetUserByEmail (GetUserByEmailRequest) returns (UserDetailsResponse);
  rpc CreateUser (CreateUserRequest) returns (UserDetailsResponse);
}

message GetUserDetailsRequest {
  int32 userId = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string phone = 3;
  string role = 4;
}

message UserDetailsResponse {
  int32 userId = 1;
  string name = 2;
  string email = 3;
  string phone = 4;
  string role = 5;
  string status = 6;
  int64 createdAt = 7;
}
